# nixpacks.toml

[phases.setup]
# Install Python 3 and FFmpeg
nixPkgs = ["python3", "ffmpeg"]

[phases.install]
# 1. Create a virtual environment named '.venv' (this folder is writable)
# 2. Use the pip inside that environment to install your requirements
cmds = [
    "python3 -m venv .venv",
    ".venv/bin/pip install -r requirements.txt"
]

[phases.build]
# Run the build script using the Virtual Environment's Python
cmds = [".venv/bin/python build.py"]

[start]
# Start the server using the Virtual Environment's Gunicorn
cmd = ".venv/bin/gunicorn app:app"