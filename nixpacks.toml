# nixpacks.toml

[phases.setup]
# The "..." is REAL SYNTAX. Do not remove it.
# It tells Railway to install Python+Pip automatically, then add ffmpeg.
nixPkgs = ["...", "ffmpeg"]

[phases.install]
# We use 'python -m pip' which is safer than just 'pip'
cmds = ["python -m pip install -r requirements.txt"]

[phases.build]
# Generates the media files before the server starts
cmds = ["python build.py"]

[start]
# Start the server
cmd = "gunicorn app:app"